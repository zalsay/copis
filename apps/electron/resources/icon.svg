<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- macOS 应用图标规范：100px 外边距，824px 内容区，185px 圆角。 -->
    <clipPath id="apple-icon-mask">
      <rect x="100" y="100" width="824" height="824" rx="185" ry="185"/>
    </clipPath>
  </defs>
  <!-- 仅取最新主标志的有效区域，避免把源图的大块黑色留白带进应用图标。 -->
  <g clip-path="url(#apple-icon-mask)">
    <svg x="100" y="100" width="824" height="824" viewBox="354 345 536 536" preserveAspectRatio="none">
      <image href="../../../main-logo.png" x="0" y="0" width="1254" height="1254"/>
    </svg>
  </g>
</svg>
