[package]
name = "copis-http-api-server"
version = "0.1.18"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
base64 = "0.22.1"
rusqlite = { version = "0.39.0", features = ["bundled"] }
ureq = { version = "3.3.0", default-features = true, features = ["socks-proxy"] }
sha2 = "0.11.0"
getrandom = "0.2.17"
chrono = { version = "0.4.45", default-features = true }
zip = { version = "4.6.1", default-features = false, features = ["deflate"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true
